name: PHP syntax check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, fileinfo
      - name: Check PHP syntax
        run: |
          set -eu
          find public -type f -name '*.php' -print0 | while IFS= read -r -d '' file; do
            php -l "$file"
          done
